# SonarCloud configuration for Venus OS Governance
# Ignore shell best-practice issues (POSIX compatibility)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e2.ruleKey=shelldre:S7677
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e3.ruleKey=shelldre:S100
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e4.ruleKey=shelldre:S7686
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e5.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.sh

# Ignore GitHub Actions permission warnings (workflow-level permissions are intentional)
sonar.issue.ignore.multicriteria=e6,e7
sonar.issue.ignore.multicriteria.e6.ruleKey=githubactions:S8233
sonar.issue.ignore.multicriteria.e6.resourceKey=.github/workflows/*.yml

# Ignore Dockerfile issues - intentional patterns for this project
# Dockerfile: Use either the version tag or the digest for the image instead of both
sonar.issue.ignore.multicriteria=e8
sonar.issue.ignore.multicriteria.e8.ruleKey=dockerfile:S7032
sonar.issue.ignore.multicriteria.e8.resourceKey=Dockerfile

# Dockerfile: Merge this RUN instruction with the consecutive ones
sonar.issue.ignore.multicriteria=e9
sonar.issue.ignore.multicriteria.e9.ruleKey=dockerfile:S7049
sonar.issue.ignore.multicriteria.e9.resourceKey=Dockerfile

# Dockerfile: Using dependencies without locking resolved versions (uv.lock pins all deps)
sonar.issue.ignore.multicriteria=e10,e11
sonar.issue.ignore.multicriteria.e10.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e10.resourceKey=Dockerfile
