name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@a02c61dedbf085ffca705f1bf3a1c053ec90d910
    with:
      pr-author: 'dependabot[bot],renovate[bot],4alvit'
