[project]
name = "venus-os-governance"
version = "0.1.0"
description = "Policy engine with approval gates for Venus OS - SOC limits, charge/discharge rules, inverter control policies with audit logging via dbus-event-log"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "dbus-next>=0.2",
    "paho-mqtt>=2.0",
    "sqlite-utils>=3.37",
    "click>=8.1",
    "rich>=13.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/victron-venus/venus-os-governance"
Repository = "https://github.com/victron-venus/venus-os-governance"
Issues = "https://github.com/victron-venus/venus-os-governance/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["venus_os_governance*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "T20", "SIM", "DTZ", "T10", "ISC", "PIE", "PT", "Q", "RET", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RSE", "RUF", "TD"]
ignore = [
    "S101", "A001", "A002", "A003", "T201", "T203", "SLF001", "RUF002",
    "ANN201", "ANN204", "ANN001", "ARG001", "TRY400", "TRY401", "TRY003", "TRY300",
    "PLC0415", "PLR2004", "PLR0913", "PLR0917", "UP042",
    "SIM105", "F541", "W292", "DTZ005", "C901", "PTH123", "E501",
]
fixable = ["A", "B", "C90", "C4", "COM", "DTZ", "E", "ERA", "F", "I", "ICN", "ISC", "NPY", "PIE", "PL", "PT", "PTH", "Q", "RSE", "RUF", "RET", "SIM", "T10", "TD", "TRY", "UP", "W"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["venus_os_governance"]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["pytest"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict_equality = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/venus_os_governance"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
